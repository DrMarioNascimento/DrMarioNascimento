<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Prof. Mário César Nascimento, PhD — Universo interativo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="neb1" cx="72%" cy="40%" r="45%"><stop offset="0" stop-color="#38e1c6" stop-opacity=".28"/><stop offset="1" stop-color="#38e1c6" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="92%" cy="80%" r="35%"><stop offset="0" stop-color="#ff5a2c" stop-opacity=".22"/><stop offset="1" stop-color="#ff5a2c" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb3" cx="55%" cy="95%" r="40%"><stop offset="0" stop-color="#a58cff" stop-opacity=".18"/><stop offset="1" stop-color="#a58cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pl" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#e9fffb"/><stop offset=".35" stop-color="#38e1c6"/><stop offset="1" stop-color="#0b3b36"/></radialGradient>
    <radialGradient id="pl2" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe3d8"/><stop offset=".4" stop-color="#ff5a2c"/><stop offset="1" stop-color="#3b1208"/></radialGradient>
    <radialGradient id="pl3" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#e3f1ff"/><stop offset=".4" stop-color="#4ea9ff"/><stop offset="1" stop-color="#0b2140"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#38e1c6"/><stop offset=".8" stop-color="#a58cff"/><stop offset="1" stop-color="#ff5a2c"/></linearGradient>
    <style>
      .t{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif;fill:#eef3f8}
      .m{font-family:'JetBrains Mono',Consolas,monospace;letter-spacing:3px;fill:#8794a2;font-size:12px}
      .tw{animation:tw 3s ease-in-out infinite}
      .tw:nth-child(3n){animation-delay:1s}.tw:nth-child(4n){animation-delay:2s}
      @keyframes tw{50%{opacity:.15}}
      .o1{animation:rot 26s linear infinite;transform-origin:860px 170px}
      .o2{animation:rot 18s linear infinite reverse;transform-origin:860px 170px}
      .o3{animation:rot 12s linear infinite;transform-origin:1060px 110px}
      @keyframes rot{to{transform:rotate(360deg)}}
      .pulse{animation:pu 3.4s linear infinite}
      @keyframes pu{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
      .cur{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="22" fill="#03050a"/>
  <rect width="1200" height="360" rx="22" fill="url(#neb1)"/><rect width="1200" height="360" rx="22" fill="url(#neb2)"/><rect width="1200" height="360" rx="22" fill="url(#neb3)"/>
  <g fill="#cfe3ff">
    <circle class="tw" cx="60" cy="40" r="1"/><circle class="tw" cx="210" cy="300" r="1.2"/><circle class="tw" cx="420" cy="60" r=".9"/><circle class="tw" cx="560" cy="320" r="1.1"/>
    <circle class="tw" cx="640" cy="40" r="1.3"/><circle class="tw" cx="700" cy="270" r=".8"/><circle class="tw" cx="760" cy="80" r="1"/><circle class="tw" cx="990" cy="300" r="1.2"/>
    <circle class="tw" cx="1130" cy="40" r="1"/><circle class="tw" cx="1160" cy="210" r="1.4"/><circle class="tw" cx="930" cy="40" r=".9"/><circle class="tw" cx="1010" cy="220" r="1"/>
    <circle class="tw" cx="340" cy="330" r="1"/><circle class="tw" cx="130" cy="180" r=".8"/><circle class="tw" cx="490" cy="200" r=".7"/><circle class="tw" cx="1100" cy="330" r="1.1"/>
  </g>
  <!-- ligações -->
  <path id="ponte1" d="M960 280 Q 930 220 860 170" fill="none" stroke="#4ea9ff" stroke-opacity=".35" stroke-dasharray="4 7"/>
  <path id="ponte2" d="M960 280 Q 1040 200 1060 110" fill="none" stroke="#4ea9ff" stroke-opacity=".35" stroke-dasharray="4 7"/>
  <circle r="4" fill="#9fd0ff" filter="url(#glow)" class="pulse" style="offset-path:path('M960 280 Q 930 220 860 170')"/>
  <circle r="4" fill="#9fd0ff" filter="url(#glow)" class="pulse" style="offset-path:path('M960 280 Q 1040 200 1060 110');animation-delay:1.7s"/>
  <!-- Fisiologia Interativa -->
  <ellipse cx="860" cy="170" rx="92" ry="26" fill="none" stroke="#38e1c6" stroke-opacity=".3" transform="rotate(-14 860 170)"/>
  <g class="o1"><circle cx="980" cy="170" r="9" fill="#f5b544" filter="url(#glow)"/></g>
  <g class="o2"><circle cx="860" cy="78" r="7" fill="#ff7a4d" filter="url(#glow)"/><circle cx="790" cy="230" r="2.5" fill="#38e1c6"/><circle cx="940" cy="210" r="2" fill="#38e1c6"/><circle cx="800" cy="120" r="2" fill="#38e1c6"/></g>
  <circle cx="860" cy="170" r="44" fill="url(#pl)" filter="url(#glow)"/>
  <circle cx="740" cy="250" r="10" fill="#a58cff" filter="url(#glow)"/>
  <circle cx="725" cy="120" r="8" fill="#c3f26a" filter="url(#glow)"/>
  <!-- Dragon -->
  <g class="o3"><circle cx="1100" cy="110" r="6" fill="#f1c863" filter="url(#glow)"/></g>
  <circle cx="1060" cy="110" r="20" fill="url(#pl2)" filter="url(#glow)"/>
  <!-- Lab RA -->
  <circle cx="960" cy="280" r="22" fill="url(#pl3)" filter="url(#glow)"/>
  <!-- texto -->
  <text x="56" y="92" class="m">PROF. · PhD · FISIOLOGIA · ÉTICA · PESQUISA · JOGOS</text>
  <text x="54" y="162" class="t" font-size="58" font-weight="500" letter-spacing="-2">Mário César</text>
  <text x="54" y="226" font-size="58" font-weight="500" letter-spacing="-2" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" fill="url(#tx)">Nascimento</text>
  <text x="56" y="268" class="t" font-size="17" fill-opacity=".72" style="fill:#a9b5c2">Ciência que você pode tocar · Science you can touch</text>
  <rect x="54" y="292" width="262" height="38" rx="19" fill="#38e1c6"/>
  <text x="76" y="316" font-family="'JetBrains Mono',Consolas,monospace" font-size="12.5" letter-spacing="1.5" fill="#011" font-weight="600">ENTRAR NO UNIVERSO →</text>
  <text x="268" y="316" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#011" class="cur">▍</text>
</svg>
